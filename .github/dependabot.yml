---
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 3
    groups:
      batch:
        patterns:
          - '*'
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 3
    groups:
      batch:
        patterns:
          - '*'
    schedule:
      interval: monthly
  - package-ecosystem: uv
    directory: /
    cooldown:
      default-days: 3
    groups:
      batch:
        patterns:
          - '*'
    schedule:
      interval: monthly
